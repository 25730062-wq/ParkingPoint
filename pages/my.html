<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#ffffff" name="theme-color"/>
<title>마이페이지 | Parking Point</title>
<link href="../css/style.css" rel="stylesheet"/>
<script defer="" src="../data/parking-data.js"></script>
<script defer="" src="../js/app.js"></script>
<style>
/* 마이페이지 예약 내역 검색·정렬 전용 스타일 */
.my-reservation-tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:14px 0 4px}
.my-reservation-tools label{display:grid;gap:7px;font-size:11px;font-weight:700;color:#555;min-width:0}
.my-reservation-tools input,.my-reservation-tools select{height:43px;width:100%;min-width:0;border:1px solid #ccc;border-radius:2px;padding:0 10px;background:#fff;color:#222;font-size:12px}
.my-reservation-tools .my-address-field{grid-column:1/-1}
.my-reservation-tools .my-search-footer{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;min-height:24px;gap:8px}
.my-reservation-tools .my-search-summary{font-size:11px;color:#666;margin:0}
.my-reservation-tools .my-search-clear{border:0;background:transparent;padding:4px 0;font-size:11px;text-decoration:underline;color:#555}
.my-reservation-tools input:focus-visible,.my-reservation-tools select:focus-visible{outline:2px solid #222;outline-offset:1px}
/* 마이페이지 예약 카드: 카드 전체는 상세 이동, 우측 취소 버튼은 별도 조작 */
.my-booking-card{position:relative;cursor:pointer}
.my-booking-link{position:absolute;inset:0;z-index:1}
.my-booking-link:focus-visible{outline:2px solid #222;outline-offset:2px}
.my-booking-actions{display:flex;justify-content:flex-end;position:relative;z-index:2;margin-top:14px;pointer-events:none}
.my-booking-cancel{min-width:100px;min-height:36px;padding:7px 12px;border:1px solid #222;background:#fff;color:#222;font-size:13px;font-weight:700;pointer-events:auto}
.my-booking-cancel:active{background:#f1f1f1}
</style>
</head>
<body data-page="my" data-prefix="../">
<div class="app-shell" id="app">
<!-- 공통 헤더와 하단 내비게이션도 HTML에서 직접 수정할 수 있습니다. -->
<header class="site-header" id="siteHeader"><a aria-label="Parking Point 홈" class="brand" href="../index.html"><span class="brand-mark brand-mark-image"><img class="brand-logo-image" src="../assets/parking-point-logo.png" alt=""/></span><span class="brand-words"><strong>Parking Point</strong><small>서울시 주차장 표준데이터</small></span></a><nav class="header-auth" aria-label="계정 메뉴"><a class="header-auth-btn" id="headerLogin" href="../pages/login.html" aria-label="로그인" title="로그인">로그인</a><button class="header-auth-btn" id="headerLogout" type="button" data-action="logout" aria-label="로그아웃" title="로그아웃" hidden>로그아웃</button></nav></header>
<main id="main-content" tabindex="-1">
<div class="profile"><div class="profile-icon"><svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewbox="0 0 24 24" width="24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-5 3-8 8-8s8 3 8 8"></path></svg></div><div><strong id="myName">방문자님</strong><p id="myGreeting">로그인하면 내 예약을 확인할 수 있어요.</p></div></div>

<div id="myBody">
<section class="section short-section" id="myReservationSection"><div class="section-top"><h2>예약 내역</h2><strong id="myCount">0건</strong></div><div class="filter-row" id="myFilters"><button class="filter" data-action="my-filter" data-filter="active" type="button">이용 중</button><button class="filter" data-action="my-filter" data-filter="past" type="button">완료·취소</button></div>
<div class="my-always-filters" id="myAlwaysFilters"><label for="myDateFilter">예약 날짜<input id="myDateFilter" type="date" aria-label="예약 날짜로 검색"/></label><label for="myDateSort">날짜 정렬<select id="myDateSort" aria-label="예약 날짜 정렬"><option value="newest">예약 날짜 최신순</option><option value="oldest">예약 날짜 오래된순</option></select></label></div>
<details class="my-reservation-filters" id="myReservationFilters"><summary>주차장 주소 검색 <span aria-hidden="true">⌄</span></summary><div class="my-reservation-tools" id="myReservationTools"><label class="my-address-field" for="myAddressQuery">주차장 주소 검색<input id="myAddressQuery" type="search" placeholder="도로명주소 또는 지역 입력" autocomplete="off"/></label><div class="my-search-footer"><p class="my-search-summary" id="mySearchSummary" aria-live="polite" hidden=""></p><button class="my-search-clear" data-action="my-clear-search" type="button">검색 초기화</button></div></div></details>
<div class="card-stack" id="myReservationCards"></div><button class="btn outline full my-more" data-action="my-more" hidden="" id="myMoreButton" type="button">예약 내역 더 보기 ↓</button></section>
<section class="section short-section" id="myFavoritesSection"><div class="section-top"><h2>저장한 주차장</h2><strong id="myFavoriteCount">0곳</strong></div><div class="card-stack" id="myFavoriteCards"></div></section>
</div>

</main>
<!-- 예약 취소 재확인: 첫 홈 위치 동의창과 동일한 앱 내부 팝업 스타일 사용 -->
<div aria-labelledby="myCancelTitle" aria-describedby="myCancelDescription" aria-modal="true" class="locate-dialog" hidden="" id="myCancelDialog" role="dialog"><div aria-hidden="true" class="menu-scrim" data-action="my-cancel-no"></div><div class="locate-box"><h2 id="myCancelTitle">정말 예약을 취소하시겠습니까?</h2><p id="myCancelDescription"><span id="myCancelReservationInfo"></span><br/>취소 후에는 되돌릴 수 없습니다.</p><div class="locate-actions"><button class="btn primary" data-action="my-cancel-yes" id="myCancelYes" type="button">네</button><button class="btn outline" data-action="my-cancel-no" type="button">아니요</button></div></div></div>
<nav aria-label="주요 메뉴" class="bottom-nav" id="bottomNav"><a class="nav-item" href="../index.html"><svg aria-hidden="true" fill="none" height="23" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewbox="0 0 24 24" width="23"><path d="m3 10 9-7 9 7v10H3z"></path><path d="M9 20v-7h6v7"></path></svg><span>홈</span></a><a class="nav-item" href="../pages/map.html"><svg aria-hidden="true" fill="none" height="23" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewbox="0 0 24 24" width="23"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"></path></svg><span>탐색</span></a><a aria-current="page" class="nav-item selected" href="../pages/my.html"><svg aria-hidden="true" fill="none" height="23" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.65" viewbox="0 0 24 24" width="23"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-5 3-8 8-8s8 3 8 8"></path></svg><span>마이</span></a></nav>
<div class="menu-overlay" hidden="" id="menuOverlay">
<div aria-hidden="true" class="menu-scrim" data-action="close-menu"></div>
<aside aria-labelledby="menuTitle" aria-modal="true" class="menu-sheet" id="menuSheet" role="dialog" tabindex="-1">
<div class="menu-header">
<h2 id="menuTitle">전체 서비스</h2>
<button aria-label="전체 메뉴 닫기" class="icon-button" data-action="close-menu" id="menuCloseButton" type="button">×</button>
</div>
<nav aria-label="전체 서비스 바로가기" class="menu-links">
<p class="menu-group-title">주차장 탐색</p>
<a href="../index.html">홈</a>
<a href="../pages/map.html">지도에서 주차장 찾기</a>
<p class="menu-group-title">예약 서비스</p>
<a href="../pages/reserve.html">주차면 예약하기</a>
<a href="../pages/my.html">내 예약 확인 · 취소</a>
<a href="../pages/favorites.html">즐겨찾기</a>
<p class="menu-group-title">계정</p>
<a href="../pages/login.html" id="menuLogin">로그인</a>
<a href="../pages/signup.html" id="menuSignup">회원가입</a>
<button data-action="logout" hidden="" id="menuLogout" type="button">로그아웃</button>
</nav>
<!-- TODO: 예약 상세·현장 이용은 예약 ID가 필요하므로 '내 예약 확인'에서 접근합니다. -->
</aside>
</div>
<div aria-live="polite" class="toast" hidden="" id="toast" role="status"></div>
</div>
</body>
</html>
